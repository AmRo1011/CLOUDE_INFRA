# =============================================================================
# Docker Compose - AWS EC2 App Node 2 Deployment
# =============================================================================
# Runs Document and Quiz services on App Node 2 EC2 instance
# Infrastructure (RDS, S3, Kafka) is managed by Terraform
# Usage: docker-compose -f docker-compose.aws-node2.yml up -d
# =============================================================================

services:
  # ===========================================================================
  # App Node 2 Services: Document + Quiz
  # Deploy this compose file to App Node 2 EC2 instance
  # ===========================================================================

  # Document Service
  document:
    image: amro1/document:phase2ssl
    container_name: platform-document
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DOCUMENT_DB_USER}:${DOCUMENT_DB_PASSWORD}@${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DATABASE}
      - DB_SCHEMA=document
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - S3_BUCKET=${DOCUMENT_S3_BUCKET}
      - S3_ENDPOINT_URL=
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - USER_MGMT_URL=http://${APP_NODE_1_PRIVATE_IP}:8001
      - SERVICE_NAME=document
      - SERVICE_PORT=8002
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-network

  # Quiz Service
  quiz:
    image: amro1/quiz:phase2ssl
    container_name: platform-quiz
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${QUIZ_DB_USER}:${QUIZ_DB_PASSWORD}@${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DATABASE}
      - DB_SCHEMA=quiz
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - S3_BUCKET=${QUIZ_S3_BUCKET}
      - S3_ENDPOINT_URL=
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - USER_MGMT_URL=http://${APP_NODE_1_PRIVATE_IP}:8001
      - SERVICE_NAME=quiz
      - SERVICE_PORT=8003
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEFAULT_QUESTIONS_PER_QUIZ=${DEFAULT_QUESTIONS_PER_QUIZ:-10}
      - QUIZ_TIME_LIMIT_MINUTES=${QUIZ_TIME_LIMIT_MINUTES:-30}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-network

# ===========================================================================
# Networks
# ===========================================================================
networks:
  platform-network:
    driver: bridge

