# =============================================================================
# Nginx API Gateway Configuration - Local Development
# =============================================================================
# Simplified configuration for local Docker Compose environment
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Upstreams - Docker service names
    upstream user_mgmt_service {
        server user-mgmt:8001;
    }

    upstream chat_service {
        server chat:8000;
    }

    upstream document_service {
        server document:8002;
    }

    upstream quiz_service {
        server quiz:8003;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # Health check
        location /health {
            default_type application/json;
            return 200 '{"status": "healthy", "service": "nginx-gateway-local"}';
        }

        # Root
        location = / {
            default_type application/json;
            return 200 '{"message": "Cloud Learning Platform API Gateway (Local)", "version": "2.0"}';
        }

        # User Management Service
        location /api/auth/ {
            proxy_pass http://user_mgmt_service/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/users/ {
            proxy_pass http://user_mgmt_service/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # Chat Service
        location /api/chat/ {
            proxy_pass http://chat_service/api/chat/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
        }

        # Document Service
        location /api/documents/ {
            proxy_pass http://document_service/api/documents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }

        # Quiz Service
        location /api/quiz/ {
            proxy_pass http://quiz_service/api/quiz/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
        }

        # Error handling
        error_page 404 = @not_found;
        location @not_found {
            return 404 '{"error": "Not Found"}';
            add_header Content-Type application/json;
        }
    }
}

