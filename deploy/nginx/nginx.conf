# =============================================================================
# Nginx API Gateway Configuration - Phase 2
# =============================================================================
# This configuration routes requests to the appropriate microservices
# Deploy this to the Nginx EC2 instance at /etc/nginx/nginx.conf
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ==========================================================================
    # Upstream Definitions - UPDATE THESE IPs FROM TERRAFORM OUTPUTS
    # ==========================================================================
    
    # App Node 1: Chat + User Management services
    upstream user_mgmt_service {
        server APP_NODE_1_PRIVATE_IP:8001;
        keepalive 32;
    }

    upstream chat_service {
        server APP_NODE_1_PRIVATE_IP:8000;
        keepalive 32;
    }

    # App Node 2: Document + Quiz services
    upstream document_service {
        server APP_NODE_2_PRIVATE_IP:8002;
        keepalive 32;
    }

    upstream quiz_service {
        server APP_NODE_2_PRIVATE_IP:8003;
        keepalive 32;
    }

    # ==========================================================================
    # Main Server Block
    # ==========================================================================
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Max upload size (for document service)
        client_max_body_size 50M;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status": "healthy", "service": "nginx-gateway"}';
            add_header Content-Type application/json;
        }

        # Root endpoint
        location = / {
            return 200 '{"message": "Cloud Learning Platform API Gateway", "version": "2.0"}';
            add_header Content-Type application/json;
        }

        # ======================================================================
        # User Management Service Routes
        # ======================================================================
        
        # Authentication endpoints (public)
        location /api/auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://user_mgmt_service/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # User management endpoints (authenticated)
        location /api/users/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://user_mgmt_service/api/users/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ======================================================================
        # Chat Service Routes
        # ======================================================================
        location /api/chat/ {
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://chat_service/api/chat/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            
            # Longer timeouts for AI responses
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # WebSocket support for real-time chat (if needed)
        location /api/chat/ws {
            proxy_pass http://chat_service/api/chat/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ======================================================================
        # Document Service Routes
        # ======================================================================
        location /api/documents/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://document_service/api/documents/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            
            # Longer timeouts for file uploads
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Buffering for large files
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # ======================================================================
        # Quiz Service Routes
        # ======================================================================
        location /api/quiz/ {
            limit_req zone=api_limit burst=30 nodelay;
            
            proxy_pass http://quiz_service/api/quiz/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            
            # Longer timeouts for quiz generation (AI)
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # ======================================================================
        # Error Pages
        # ======================================================================
        error_page 404 = @not_found;
        location @not_found {
            return 404 '{"error": "Not Found", "message": "The requested endpoint does not exist"}';
            add_header Content-Type application/json;
        }

        error_page 500 502 503 504 = @server_error;
        location @server_error {
            return 500 '{"error": "Internal Server Error", "message": "Something went wrong. Please try again later."}';
            add_header Content-Type application/json;
        }
    }

    # ==========================================================================
    # HTTPS Server Block (for production - requires SSL certificates)
    # ==========================================================================
    # Uncomment and configure when SSL is set up
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #
    #     # ... same location blocks as above ...
    # }
}

