# =============================================================================
# Phase 2 CI/CD Pipeline
# =============================================================================
# Runs on PRs to phase-2 branch and on merges to phase-2
# =============================================================================

name: Phase 2 CI/CD

on:
  push:
    branches:
      - phase-2
    paths:
      - 'services/**'
      - 'deploy/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - phase-2
    paths:
      - 'services/**'
      - 'deploy/**'
      - '.github/workflows/**'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_PREFIX: cloud-learning-platform

jobs:
  # ---------------------------------------------------------------------------
  # Detect which services changed
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      user-mgmt: ${{ steps.filter.outputs.user-mgmt }}
      chat: ${{ steps.filter.outputs.chat }}
      document: ${{ steps.filter.outputs.document }}
      quiz: ${{ steps.filter.outputs.quiz }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            user-mgmt:
              - 'services/user-mgmt/**'
            chat:
              - 'services/chat/**'
            document:
              - 'services/document/**'
            quiz:
              - 'services/quiz/**'

  # ---------------------------------------------------------------------------
  # Test and Build User Management Service
  # ---------------------------------------------------------------------------
  test-user-mgmt:
    needs: detect-changes
    if: needs.detect-changes.outputs.user-mgmt == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-mgmt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Build Docker image
        run: |
          docker build -t user-mgmt-service:test .

  # ---------------------------------------------------------------------------
  # Test and Build Chat Service
  # ---------------------------------------------------------------------------
  test-chat:
    needs: detect-changes
    if: needs.detect-changes.outputs.chat == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Build Docker image
        run: |
          docker build -t chat-service:test .

  # ---------------------------------------------------------------------------
  # Test and Build Document Service
  # ---------------------------------------------------------------------------
  test-document:
    needs: detect-changes
    if: needs.detect-changes.outputs.document == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/document
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Build Docker image
        run: |
          docker build -t document-service:test .

  # ---------------------------------------------------------------------------
  # Test and Build Quiz Service
  # ---------------------------------------------------------------------------
  test-quiz:
    needs: detect-changes
    if: needs.detect-changes.outputs.quiz == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/quiz
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Build Docker image
        run: |
          docker build -t quiz-service:test .

  # ---------------------------------------------------------------------------
  # Build and Push to ECR (only on merge to phase-2)
  # ---------------------------------------------------------------------------
  build-and-push:
    needs: [detect-changes, test-user-mgmt, test-chat, test-document, test-quiz]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/phase-2' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push User Management
        if: needs.detect-changes.outputs.user-mgmt == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd services/user-mgmt
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-user-mgmt:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-user-mgmt:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-user-mgmt:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-user-mgmt:latest

      - name: Build and push Chat
        if: needs.detect-changes.outputs.chat == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd services/chat
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-chat:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-chat:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-chat:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-chat:latest

      - name: Build and push Document
        if: needs.detect-changes.outputs.document == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd services/document
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-document:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-document:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-document:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-document:latest

      - name: Build and push Quiz
        if: needs.detect-changes.outputs.quiz == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd services/quiz
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-quiz:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-quiz:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-quiz:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX-quiz:latest

      - name: Output image tags
        run: |
          echo "Images pushed with tag: ${{ github.sha }}"
          echo "Also tagged as: latest"

